{{ define "main" }}
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>

  <div class="projects-grid">
    {{ range .Pages }}
      <article class="project-card">
        <a href="{{ .RelPermalink }}">
          {{ with .Params.image }}
            <div class="project-thumb">
              <img src="{{ . }}" alt="{{ $.Title }}">
            </div>
          {{ end }}

          <h2>{{ .Title }}</h2>

          {{ with .Params.summary }}
            <p>{{ . }}</p>
          {{ end }}

          <div class="project-meta">
            {{ .ReadingTime }} min read
          </div>
        </a>
      </article>
    {{ end }}
  </div>
{{ end }}
